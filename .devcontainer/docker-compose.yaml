services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1.25-bookworm
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - ..:/app:cached
    command: sleep infinity

  mongo:
    hostname: ${MONGO_HOST}
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - ${MONGO_LOCAL_PORT}:27017
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.2"
          memory: 256M

  mongo_express:
    hostname: ${MONGO_EXPRESS_HOST}
    image: mongo-express:1
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST}
      ME_CONFIG_MONGODB_PORT: ${MONGO_PORT}
    ports:
      - ${MONGO_EXPRESS_LOCAL_PORT}:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.2"
          memory: 256M

  redis:
    hostname: ${REDIS_HOST}
    image: redis:8
    restart: unless-stopped
    ports:
      - ${REDIS_LOCAL_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.2"
          memory: 256M

  postgres:
    hostname: ${POSTGRES_HOST}
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_LOCAL_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username ${POSTGRES_USER} --dbname ${POSTGRES_DB}",
        ]
      interval: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.2"
          memory: 256M
        limits:
          cpus: "0.4"
          memory: 512M

  opensearch:
    hostname: ${OPENSEARCH_HOST}
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: "single-node"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
    ports:
      - ${OPENSEARCH_LOCAL_PORT}:9200
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.3"
          memory: 512M
        limits:
          cpus: "0.6"
          memory: 1G

volumes:
  postgres_data:
  opensearch_data:
